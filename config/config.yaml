# JobPulse 招聘情报站 — 全局配置
# 敏感信息（DB 密码）通过环境变量 DB_PASSWORD 注入，此处为占位符

database:
  # 主存储：MySQL（本机 8.x）；开发兜底可切换 sqlite
  driver: mysql          # mysql | sqlite
  host: localhost
  port: 3306
  user: root
  password_env: DB_PASSWORD   # 从环境变量读取密码
  password_default: "123456"  # 本机开发默认（不入库 .env 时使用）
  name: jobpulse
  charset: utf8mb4
  sqlite_path: data/jobpulse.db   # driver=sqlite 时的兜底库路径

crawler:
  # 10 城（统一不带"市"后缀）
  cities:
    - 北京
    - 上海
    - 广州
    - 深圳
    - 杭州
    - 成都
    - 南京
    - 武汉
    - 西安
    - 苏州
  # 岗位大类 -> 搜索关键词（附录 11.2 映射，唯一依据）
  categories:
    数据分析: [数据分析, 数据分析师]
    数据科学: [数据科学]
    大数据: [大数据开发, 大数据工程师]
    算法: [算法工程师, 机器学习]
    BI数仓: [BI工程师, 数据仓库]
  # 反爬参数（REQ-DC-02）
  delay_min: 2
  delay_max: 5
  retry_times: 3
  retry_backoff: 2.0        # 指数退避基数（秒）
  page_size: 50
  max_pages_per_keyword: 10
  # 健康监控告警阈值（REQ-DC-07）
  alert_hit_rate: 0.30      # 整体命中率低于该值告警
  # checkpoint（REQ-DC-04）
  checkpoint_dir: data/checkpoints
  # 兜底数据源
  backup_dataset: data/raw/job_posting_data.xlsx   # 兜底数据集文件路径（Rayair019/Job-posting-data，2025 中国平台岗位）
  backup_source_id: backup

etl:
  random_seed: 42           # REQ-DQ-05 可复现固定种子
  industry_threshold: 50    # 行业低频归并阈值（REQ-DQ-02）

nlp:
  skill_words_path: config/skill_words.json
  stopwords_path: config/stopwords.txt
  userdict_path: config/userdict.txt
  top_k: 30                 # 技能 Top30（REQ-NLP-03）

model:
  test_size: 0.2            # 8:2 划分（REQ-ML-02）
  random_state: 42
  xgboost_params:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

viz:
  dashboard_output: output/dashboard/jobpulse_dashboard.html

paths:
  data_dir: data
  output_dir: output
  charts_dir: output/charts
  reports_dir: output/reports
  features_path: output/analysis/features.parquet   # REQ-NLP-05
  report_path: output/reports/report.md             # REQ-DEL-02
  dq_report_path: output/reports/data_quality_report.md   # REQ-DQ-03
  model_eval_path: output/reports/model_evaluation.md     # REQ-DEL-04
  logs_dir: logs
